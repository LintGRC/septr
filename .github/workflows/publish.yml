name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/septr-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/septr-node/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/septr-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build twine
      - run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/septr-python/dist

  publish-go:
    name: Go module (auto-published via Git tag)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/septr-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: packages/septr-go/go.sum
      - run: go vet ./...
      - run: go test ./...
      - name: Verify module is resolvable
        run: go list -m github.com/lintgrc/septr/packages/septr-go@$(git rev-parse HEAD)
